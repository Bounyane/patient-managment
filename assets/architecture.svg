<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="490" rx="12" fill="#0b1f33"/>

  <!-- Docker network -->
  <rect x="235" y="15" width="710" height="460" rx="10" fill="#10304a" stroke="#4a7ca3" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="590" y="42" fill="#cfe3f3" font-size="16" text-anchor="middle">Docker Network</text>

  <!-- Connection lines -->
  <g stroke-width="2" stroke-dasharray="6 5" fill="none">
    <path d="M180,230 L300,230" stroke="#4fc3f7"/>
    <path d="M500,195 L600,195 L600,85 L720,85" stroke="#66bb6a"/>
    <path d="M500,245 L620,245" stroke="#ffa726"/>
    <path d="M780,275 L780,370" stroke="#ffa726"/>
    <path d="M400,290 L400,370" stroke="#b0bec5"/>
  </g>

  <!-- Line labels -->
  <g font-size="13" fill="#e8f1f8" text-anchor="middle">
    <text x="240" y="218">REST</text>
    <text x="240" y="250" fill="#9fc4de">(JSON)</text>
    <text x="548" y="150" fill="#a5d6a7">gRPC</text>
    <text x="548" y="168" fill="#9fc4de">(Protobuf)</text>
    <text x="560" y="236" fill="#ffcc80">publish</text>
    <text x="830" y="326" fill="#ffcc80">consume</text>
  </g>

  <!-- Client -->
  <rect x="20" y="190" width="160" height="80" rx="6" fill="#5a3029" stroke="#a5645a"/>
  <text x="100" y="236" fill="#fff" font-size="17" text-anchor="middle">Frontend (Client)</text>

  <!-- Patient service -->
  <rect x="300" y="165" width="200" height="125" rx="6" fill="#5a3029" stroke="#a5645a"/>
  <text x="400" y="222" fill="#fff" font-size="17" text-anchor="middle">patient-service</text>
  <text x="400" y="244" fill="#d9b8b2" font-size="13" text-anchor="middle">:4000</text>
  <rect x="432" y="180" width="64" height="26" rx="3" fill="#1f3a2a" stroke="#66bb6a"/>
  <text x="464" y="198" fill="#a5d6a7" font-size="12" text-anchor="middle">gRPC Client</text>
  <rect x="418" y="255" width="78" height="26" rx="3" fill="#2d2a3a" stroke="#ffa726"/>
  <text x="457" y="273" fill="#ffcc80" font-size="12" text-anchor="middle">Kafka Producer</text>

  <!-- PostgreSQL -->
  <rect x="320" y="370" width="160" height="70" rx="6" fill="#1d3b53" stroke="#4a7ca3"/>
  <text x="400" y="403" fill="#fff" font-size="16" text-anchor="middle">PostgreSQL</text>
  <text x="400" y="423" fill="#9fc4de" font-size="12" text-anchor="middle">patients table</text>

  <!-- Billing service -->
  <rect x="720" y="45" width="200" height="90" rx="6" fill="#5a3029" stroke="#a5645a"/>
  <rect x="728" y="55" width="62" height="26" rx="3" fill="#1f3a2a" stroke="#66bb6a"/>
  <text x="759" y="73" fill="#a5d6a7" font-size="12" text-anchor="middle">gRPC Server</text>
  <text x="830" y="104" fill="#fff" font-size="16" text-anchor="middle">billing-service</text>
  <text x="830" y="123" fill="#d9b8b2" font-size="12" text-anchor="middle">:4001 / :9001</text>

  <!-- Kafka topic -->
  <rect x="620" y="205" width="310" height="70" rx="6" fill="#0d1b2a" stroke="#4a7ca3"/>
  <text x="775" y="228" fill="#fff" font-size="15" text-anchor="middle">Kafka Topic (patient)</text>
  <g fill="#e8f1f8">
    <rect x="640" y="245" width="9" height="9"/><rect x="672" y="245" width="9" height="9"/>
    <rect x="704" y="245" width="9" height="9"/><rect x="736" y="245" width="9" height="9"/>
    <rect x="768" y="245" width="9" height="9"/><rect x="800" y="245" width="9" height="9"/>
    <rect x="832" y="245" width="9" height="9"/><rect x="864" y="245" width="9" height="9"/>
    <rect x="896" y="245" width="9" height="9"/>
  </g>

  <!-- Analytics service -->
  <rect x="680" y="370" width="200" height="90" rx="6" fill="#5a3029" stroke="#a5645a"/>
  <rect x="735" y="360" width="90" height="26" rx="3" fill="#2d2a3a" stroke="#ffa726"/>
  <text x="780" y="378" fill="#ffcc80" font-size="12" text-anchor="middle">Kafka Consumer</text>
  <text x="780" y="418" fill="#fff" font-size="16" text-anchor="middle">analytics-service</text>
  <text x="780" y="438" fill="#d9b8b2" font-size="12" text-anchor="middle">:4002</text>

  <!-- Moving data dots -->
  <!-- REST -->
  <circle r="6" fill="#4fc3f7">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M180,230 L300,230"/>
  </circle>
  <!-- DB write -->
  <circle r="5" fill="#cfd8dc">
    <animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" path="M400,290 L400,370"/>
  </circle>
  <!-- gRPC -->
  <circle r="6" fill="#66bb6a">
    <animateMotion dur="2.4s" begin="1.0s" repeatCount="indefinite" path="M500,195 L600,195 L600,85 L720,85"/>
  </circle>
  <!-- Kafka publish -->
  <circle r="6" fill="#ffa726">
    <animateMotion dur="2.4s" begin="1.4s" repeatCount="indefinite" path="M500,245 L620,245"/>
  </circle>
  <!-- Kafka consume -->
  <circle r="6" fill="#ffa726">
    <animateMotion dur="2.4s" begin="1.9s" repeatCount="indefinite" path="M780,275 L780,370"/>
  </circle>
</svg>
